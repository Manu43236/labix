services:
  mysql:
    image: mysql:8.0
    container_name: labix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: labix
      MYSQL_USER: labix
      MYSQL_PASSWORD: labix
    ports:
      - "3306:3306"
    volumes:
      - labix-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  labix-mysql-data:
